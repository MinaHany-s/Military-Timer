<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Countdown</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="title">⏳ Countdown Until I Finish Military Service</h1>

    <p class="subtitle">
      Every day is one step closer to freedom, new opportunities, and the next
      chapter.
    </p>
    <div class="countdown">
      <div class="box">
        <h2 id="days">0</h2>
        <span>Days</span>
      </div>

      <div class="box">
        <h2 id="hours">0</h2>
        <span>Hours</span>
      </div>

      <div class="box">
        <h2 id="minutes">0</h2>
        <span>Minutes</span>
      </div>

      <div class="box">
        <h2 id="seconds">0</h2>
        <span>Seconds</span>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
